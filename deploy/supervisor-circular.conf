[program:circular-backend]
directory=/www/wwwroot/circular/backend
command=/www/wwwroot/circular/backend/.venv/bin/gunicorn -c /www/wwwroot/circular/backend/gunicorn_conf.py run:app
user=www
autostart=true
autorestart=true
startsecs=10
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/www/wwwroot/circular/backend/logs/supervisor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED="1"

